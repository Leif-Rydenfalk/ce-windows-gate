# The Windows release gate: every ce installer runs once on a real Windows (windows-latest has WebView2) before it
# goes to a customer. `windows-build gate <exe>` uploads the exe as a private prerelease asset, dispatches this job,
# waits and fetches the evidence (screenshot + report). Public repo: no customer data, no page text uploaded.
name: windows-gate
on:
  workflow_dispatch:
    inputs:
      asset: { description: "installer file name", required: true }
      sha256: { description: "expected sha256 of the installer", required: true }
permissions:
  contents: read
jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: download and check sha
        env: { EXE_URL: "${{ secrets.EXE_URL }}" }
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, dl | Out-Null
          Invoke-WebRequest -Uri $env:EXE_URL -OutFile "dl/${{ inputs.asset }}" -UseBasicParsing
          $h = (Get-FileHash "dl/${{ inputs.asset }}" -Algorithm SHA256).Hash.ToLower()
          "sha256 $h" | Tee-Object -Append out/report.txt
          if ($h -ne "${{ inputs.sha256 }}".ToLower()) { throw "sha mismatch: got $h" }
      - name: silent install
        shell: pwsh
        run: |
          $p = Start-Process "dl/${{ inputs.asset }}" -ArgumentList "/S" -Wait -PassThru
          "install exit $($p.ExitCode)" | Tee-Object -Append out/report.txt
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = @("$env:ProgramFiles\ce\ce.exe", "$env:LOCALAPPDATA\ce\ce.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "ce.exe not installed" }
          "exe $exe" | Tee-Object -Append out/report.txt
          "CE_EXE=$exe" | Out-File -Append $env:GITHUB_ENV
      - name: start ce, read the window, screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/out/$name.png")
          }
          # what a person sees, read through UI Automation (WebView2 exposes the page to it)
          function Names($ce) {
            $ce.Refresh()
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($ce.MainWindowHandle)
            $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $all | ForEach-Object { "$($_.Current.ControlType.ProgrammaticName -replace 'ControlType.','')`t$($_.Current.Name)" } | Where-Object { $_ -notmatch "`t$" }
          }
          $ce = Start-Process $env:CE_EXE -PassThru
          Start-Sleep 20
          if ($ce.HasExited) { "ce exited $($ce.ExitCode)" | Tee-Object -Append out/report.txt; throw "ce.exe exited" }
          "ce alive after 20 s; webview2 procs $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)" | Tee-Object -Append out/report.txt
          Shot screen-20s
          $n20 = Names $ce
          Start-Sleep 25
          Shot screen-45s
          $n45 = Names $ce
          $n45 | Out-File out/ui-45s.txt
          $join20 = @($n20 | Where-Object { $_ -match "^(Button|Edit)`t.*(join|sign in|invite|code)" }).Count
          $join45 = @($n45 | Where-Object { $_ -match "^(Button|Edit)`t.*(join|sign in|invite|code)" }).Count
          "ui elements 20s=$(@($n20).Count) 45s=$(@($n45).Count); join controls 20s=$join20 45s=$join45" | Tee-Object -Append out/report.txt
          # WebView2 builds its accessibility tree on the first read, so the 20 s read can come back nearly empty: 45 s decides
          if ($join45 -eq 0) { throw "no join or sign-in control 45 s after start" }
          if ($n45 -match "Leif") { throw "the window names Leif" }
      - name: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: windows-gate, path: out, retention-days: 3 }
