# The Windows release gate: every ce installer runs once on a real Windows (windows-latest has WebView2) before it
# goes to a customer. `windows-build gate <exe>` uploads the exe as a private prerelease asset, dispatches this job,
# waits and fetches the evidence (screenshot + report). Public repo: no customer data, no page text uploaded.
name: windows-gate
on:
  workflow_dispatch:
    inputs:
      asset: { description: "installer file name", required: true }
      sha256: { description: "expected sha256 of the installer", required: true }
permissions:
  contents: read
jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: download and check sha
        env: { EXE_URL: "${{ secrets.EXE_URL }}" }
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, dl | Out-Null
          Invoke-WebRequest -Uri $env:EXE_URL -OutFile "dl/${{ inputs.asset }}" -UseBasicParsing
          $h = (Get-FileHash "dl/${{ inputs.asset }}" -Algorithm SHA256).Hash.ToLower()
          "sha256 $h" | Tee-Object -Append out/report.txt
          if ($h -ne "${{ inputs.sha256 }}".ToLower()) { throw "sha mismatch: got $h" }
      - name: silent install
        shell: pwsh
        run: |
          $p = Start-Process "dl/${{ inputs.asset }}" -ArgumentList "/S" -Wait -PassThru
          "install exit $($p.ExitCode)" | Tee-Object -Append out/report.txt
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = @("$env:ProgramFiles\ce\ce.exe", "$env:LOCALAPPDATA\ce\ce.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "ce.exe not installed" }
          "exe $exe" | Tee-Object -Append out/report.txt
          "CE_EXE=$exe" | Out-File -Append $env:GITHUB_ENV
      - name: start ce, read the window, screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/out/$name.png")
          }
          # what a person sees, read through UI Automation (WebView2 exposes the page to it)
          function Names($ce) {
            $ce.Refresh()
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($ce.MainWindowHandle)
            $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $all | ForEach-Object { "$($_.Current.ControlType.ProgrammaticName -replace 'ControlType.','')`t$($_.Current.Name)" } | Where-Object { $_ -notmatch "`t$" }
          }
          # every console window that shows while ce runs: ce.exe is a windowed program, so a console program it starts
          # without CREATE_NO_WINDOW flashes a black window (3DWayTech 10-26: "everything is flashing every 3 seconds")
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Threading; using System.Runtime.InteropServices;
          public static class ConWatch {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            public static int Seen; public static volatile bool Stop;
            static readonly System.Collections.Generic.HashSet<IntPtr> Known = new System.Collections.Generic.HashSet<IntPtr>();
            public static void Start() {
              EnumWindows((h, l) => { Known.Add(h); return true; }, IntPtr.Zero);
              new Thread(() => { while (!Stop) { EnumWindows((h, l) => {
                if (IsWindowVisible(h) && !Known.Contains(h)) { var c = new StringBuilder(256); GetClassName(h, c, 256);
                  var k = c.ToString(); if (k == "ConsoleWindowClass" || k == "CASCADIA_HOSTING_WINDOW_CLASS") { Known.Add(h); Interlocked.Increment(ref Seen); } }
                return true; }, IntPtr.Zero); Thread.Sleep(5); } }) { IsBackground = true }.Start();
            }
          }
          "@
          [ConWatch]::Start()
          $ce = Start-Process $env:CE_EXE -PassThru
          Start-Sleep 20
          if ($ce.HasExited) { "ce exited $($ce.ExitCode)" | Tee-Object -Append out/report.txt; throw "ce.exe exited" }
          "ce alive after 20 s; webview2 procs $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)" | Tee-Object -Append out/report.txt
          Shot screen-20s
          $n20 = Names $ce
          Start-Sleep 25
          Shot screen-45s
          $n45 = Names $ce
          $n45 | Out-File out/ui-45s.txt
          $join20 = @($n20 | Where-Object { $_ -match "^(Button|Edit)`t.*(join|sign in|invite|code)" }).Count
          $join45 = @($n45 | Where-Object { $_ -match "^(Button|Edit)`t.*(join|sign in|invite|code)" }).Count
          "ui elements 20s=$(@($n20).Count) 45s=$(@($n45).Count); join controls 20s=$join20 45s=$join45" | Tee-Object -Append out/report.txt
          # WebView2 builds its accessibility tree on the first read, so the 20 s read can come back nearly empty: 45 s decides
          if ($join45 -eq 0) { throw "no join or sign-in control 45 s after start" }
          if ($n45 -match "Leif") { throw "the window names Leif" }
          # sign in with an invite link pasted the way a person does (trailing slash), as 3DWayTech did: the system
          # browser must open on the gate's join page (not Explorer on Documents), with no console flashing while the
          # app waits for the sign-in (it asks every 3 s). The code is a dummy: the gate treats it as no invite.
          $root = [System.Windows.Automation.AutomationElement]::FromHandle($ce.MainWindowHandle)
          $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
          $inv = $all | Where-Object { $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Edit -and $_.Current.Name -match "invite" } | Select-Object -First 1
          $go = $all | Where-Object { $_.Current.ControlType -eq [System.Windows.Automation.ControlType]::Button -and $_.Current.Name -match "^sign in with" } | Select-Object -First 1
          if (-not $go) { throw "no sign-in button" }
          if ($inv) { $inv.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue("https://apps.ce-net.com/invite/gatecheck000000000/ ") }
          $before = [ConWatch]::Seen
          # WebView2 buttons do not always offer Invoke: then click the middle of the button as a person does
          $ip = $null
          if ($go.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$ip)) { $ip.Invoke() } else {
            $r = $go.Current.BoundingRectangle
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2))
            Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);' -Name Mouse -Namespace Gate
            [Gate.Mouse]::mouse_event(2, 0, 0, 0, 0); [Gate.Mouse]::mouse_event(4, 0, 0, 0, 0)
          }
          Start-Sleep 20
          [ConWatch]::Stop = $true
          $browser = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(msedge|chrome|firefox)\.exe$' -and $_.CommandLine -match 'apps\.ce-net\.com/__gate/join\?node=[0-9a-f]{64}&host=[^&\s]+&invite=gatecheck000000000' }).Count
          $docs = @((New-Object -ComObject Shell.Application).Windows() | Where-Object { $_.LocationName -match 'Documents' }).Count
          "consoles start..45s=$before after-sign-in=$([ConWatch]::Seen - $before); browser on join page=$browser; explorer Documents=$docs; ce alive=$(-not $ce.HasExited)" | Tee-Object -Append out/report.txt
          Shot screen-sign-in
          if ($ce.HasExited) { throw "ce.exe exited after sign-in" }
          if ([ConWatch]::Seen -gt 0) { throw "$([ConWatch]::Seen) console windows flashed" }
          if ($docs -gt 0) { throw "sign-in opened Explorer on Documents" }
          if ($browser -eq 0) { throw "sign-in opened no browser on the join page" }
      - name: evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: windows-gate, path: out, retention-days: 1 }
